services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: technical-store-backend
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      # - NODE_ENV=production # Mở comment khi muốn chạy production mode hoàn toàn

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: technical-store-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
